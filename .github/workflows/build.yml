name: Build Custom Caddy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # 只看 go.mod / go.sum：main.go 的任何实质变更都必然伴随这两者变化，
    # 单独改 main.go（比如 plugins.txt 只调了顺序）产出的二进制是一样的，不值得重建
    paths:
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: write

concurrency:
  group: build-caddy
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  # 冒烟测试的模块数下限。标准 Caddy 约 100 个，加 18 个插件后远超这个数；
  # 明显偏少说明有插件没注册进去。加减插件时可用仓库变量 MIN_MODULES 调。
  MIN_MODULES: ${{ vars.MIN_MODULES || 100 }}

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.ver.outputs.tag }}
      core_version: ${{ steps.ver.outputs.core }}
      build_time: ${{ steps.ver.outputs.time }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 版本号只在这里生成一次，两个架构共用，避免跨分钟产生不同 tag。
      #
      # 格式:  v2.11.4-20260807.1930
      #        └─上游核心─┘└─构建日期┘└时分┘
      #
      # 为什么带上核心版本：CustomVersion 会整个替换掉 Caddy 自报的版本，
      # 纯时间戳会让 `caddy version` 完全看不出这是 2.11 还是 2.12 —— 而这
      # 恰恰是查文档、搜报错时最先需要的信息。
      #
      # 为什么用日期而不是递增构建号：旧 release 会被自动清理，靠数已有
      # release 来递增会重号。
      #
      # 为什么不把插件版本编进去：18 个插件会让 tag 长到没法读，且插件版本
      # 已记录在 release notes、go_modules.json 和二进制的 caddy build-info 里。
      # tag 是标识符，不是清单。
      - name: Generate Global Version Tag
        id: ver
        run: |
          set -euo pipefail

          CORE="$(awk '$1=="github.com/caddyserver/caddy/v2" && $2 ~ /^v[0-9]/ {print $2; exit}' go.mod)"
          if [ -z "$CORE" ]; then
            echo "::error::无法从 go.mod 解析 Caddy 核心版本"
            exit 1
          fi

          TAG="${CORE}-$(date +'%Y%m%d.%H%M')"
          echo "核心版本: ${CORE}"
          echo "本次 tag: ${TAG}"

          {
            echo "core=${CORE}"
            echo "tag=${TAG}"
            echo "time=$(date +'%Y-%m-%d %H:%M:%S (Beijing)')"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: init
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goos: linux
          - goarch: arm64
            goos: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      # 固定资产名，保住 releases/latest/download/caddy-linux-amd64 这个永久直链
      - name: Resolve asset name
        run: echo "ASSET=caddy-${{ matrix.goos }}-${{ matrix.goarch }}" >> "$GITHUB_ENV"

      # ============================================================
      # 1. 编译
      #    main.go / go.mod / go.sum 都由 update_deps.yml 生成并提交，
      #    这里【不】跑 go mod tidy —— -mod=readonly（默认值）会在
      #    依赖不完整时直接报错，而不是悄悄改写 go.sum 让构建不可复现。
      # ============================================================
      - name: Verify module is tidy
        run: |
          set -euo pipefail
          test -f main.go || { echo "::error::缺少 main.go，请先手动跑一次 Update Dependencies"; exit 1; }
          go mod download
          go mod verify

          # go mod tidy -diff (Go 1.23+)：只报告不改写。
          # 这里失败通常意味着有人手改了 main.go 或 plugins.txt 却没跑 update_deps。
          if go mod tidy -diff >/dev/null 2>&1; then
            echo "✓ go.mod / go.sum 与 main.go 一致"
          else
            echo "::error::go.mod / go.sum 与 main.go 不一致，请先运行 Update Dependencies 工作流"
            go mod tidy -diff || true
            exit 1
          fi

      - name: Build Caddy (${{ matrix.goarch }})
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # 刻意【不】设 -X ...CustomVersion=：
          # CustomVersion 会整个替换掉 Caddy 自报的版本。不设时 Caddy 从
          # debug.ReadBuildInfo() 读依赖 caddy/v2 的版本，`caddy version`
          # 输出与官方二进制、与 xcaddy 构建完全一致 —— 这个产物就是 Caddy，
          # 只是多带插件，不应该伪装成另一个东西。
          # release tag 是仓库侧的标识，由 install.sh 单独记录，不进二进制。
          go build -mod=readonly \
            -o "${{ env.ASSET }}" \
            -ldflags="-w -s" \
            -trimpath \
            -tags nobadger,nomysql,nopgx
          ls -lh "${{ env.ASSET }}"

      # ============================================================
      # 2. 冒烟测试（只有 amd64 能在 runner 上直接执行）
      # ============================================================
      - name: Smoke Test
        if: matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          BIN="./${{ env.ASSET }}"
          chmod +x "$BIN"

          echo "=== version ==="
          VER="$("$BIN" version)"
          echo "$VER"
          # 必须与 go.mod 里的核心版本一致 —— 即与官方 caddy 输出同形
          case "$VER" in
            "${{ needs.init.outputs.core_version }}"*)
              echo "✓ caddy version 与上游一致" ;;
            *)
              echo "::error::期望以 ${{ needs.init.outputs.core_version }} 开头，实际: $VER"
              exit 1 ;;
          esac

          # 模块 ID 冲突会让 caddy 在 init 阶段 panic，list-modules 是最早的探针
          echo "=== list-modules ==="
          COUNT="$("$BIN" list-modules --versions | wc -l)"
          echo "已注册模块数: $COUNT (下限 ${MIN_MODULES})"
          [ "$COUNT" -gt "$MIN_MODULES" ] \
            || { echo "::error::模块数异常偏少，可能有插件没注册进去"; exit 1; }

          # 非标准模块（即插件提供的）清单，方便肉眼核对
          echo "=== non-standard modules ==="
          "$BIN" list-modules --packages | grep -F 'github.com/' | grep -vF 'caddyserver/caddy' || true

      # ============================================================
      # 3. Release Notes（只在 amd64 生成）
      # ============================================================
      - name: Generate Release Notes
        if: matrix.goarch == 'amd64'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_VERSION: ${{ needs.init.outputs.version_tag }}
          BUILD_TIME: ${{ needs.init.outputs.build_time }}
        run: |
          set -euo pipefail
          source scripts/ci-lib.sh

          go list -m -json all | jq -s '.' > go_modules.json

          # 拉上一个 Release 的同名产物做对比。
          #
          # 这里必须区分两种「拿不到」，旧版一律回落成空数组是个静默降级：
          # 一次网络抖动就会让 release notes 把全部 18 个插件列成 ✨ Added、
          # 并且把真正的 Caddy Core 升级那一行整个吞掉 —— 正文看上去完全正常，
          # 没有任何地方提示对比基准其实是空的。
          if retry 4 5 -- gh release download \
               --pattern 'go_modules.json' --output prev_go_modules.json --clobber; then
            PREV_SOURCE=ok
          elif gh_retry /tmp/rel_count.txt release list --limit 1 --json tagName --jq 'length' \
               && [ "$(tr -d ' \r\n' < /tmp/rel_count.txt)" = "0" ]; then
            PREV_SOURCE=none            # 首次发布，本来就没有基准
            echo '[]' > prev_go_modules.json
          else
            PREV_SOURCE=failed          # 有上一个 release，但没取到
            echo '[]' > prev_go_modules.json
            echo "::warning::未能获取上一个 Release 的 go_modules.json，本次变更日志没有对比基准"
          fi
          echo "对比基准: ${PREV_SOURCE}"

          GO_VERSION="$(go version | awk '{print $3}')" \
          PREV_SOURCE="$PREV_SOURCE" python3 scripts/release_notes.py

      - name: Generate Checksum
        run: sha256sum "${{ env.ASSET }}" > "${{ env.ASSET }}.sha256"

      # 二进制 + 校验和：两个架构都有
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: caddy-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      # 元数据：只有 amd64 有，单独上传避免 arm64 刷 warning
      - name: Upload Metadata
        if: matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: metadata
          if-no-files-found: error
          path: |
            final_note.md
            go_modules.json
            main.go

  release:
    needs: [init, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Body
        run: |
          set -euo pipefail
          cp artifacts/metadata/final_note.md body.md
          {
            echo ""
            echo "### 🛡️ SHA256 Checksums"
            echo '```'
            cat artifacts/caddy-amd64/*.sha256
            cat artifacts/caddy-arm64/*.sha256
            echo '```'
            echo ""
            echo "### 📥 安装 / 更新"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch || 'main' }}/scripts/install.sh | sudo bash"
            echo '```'
          } >> body.md
          cat body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init.outputs.version_tag }}
          name: ${{ needs.init.outputs.version_tag }}
          body_path: body.md
          files: |
            artifacts/caddy-amd64/*
            artifacts/caddy-arm64/*
            artifacts/metadata/go_modules.json
            artifacts/metadata/main.go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 每次成功发布后顺手清理旧版本。
      # 留旧构建的代价不是存储（GitHub 对 release 总大小和带宽都无限制），而是
      # 「一键降级」：一年前的二进制带着一年份未修补的 CVE，却能被 CADDY_TAG=
      # 直接装回任何一台机器。保留数量可用仓库变量 KEEP_RELEASES 覆盖
      #（Settings → Secrets and variables → Actions → Variables）。
      # 清理失败不该把一次成功的发布标红：产物已经发出去了，少删几个旧版本
      # 下次构建会补上。真正需要红的是编译和发布，不是垃圾回收。
      - name: Prune old releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # 本 job 没有 checkout，gh 需要显式指定仓库
          KEEP: ${{ vars.KEEP_RELEASES || 12 }}
        run: |
          set -euo pipefail

          # 这个 job 没有 checkout，ci-lib.sh 取不到，重试就地写一份小的
          gh_retry() {
            local out="$1"; shift
            local i
            for i in 1 2 3; do
              gh "$@" > "$out" 2>/tmp/gh.err && return 0
              echo "  gh 第 ${i}/3 次失败: $(tail -n1 /tmp/gh.err)" >&2
              sleep $(( i * 5 ))
            done
            echo "::warning::gh 重试 3 次仍失败: gh $*"
            return 1
          }

          # 下限保护：无论变量填成什么，至少保留 3 个
          [ "$KEEP" -ge 3 ] 2>/dev/null || KEEP=3

          gh_retry /tmp/total.txt release list --limit 500 --json tagName --jq 'length'
          TOTAL="$(tr -d ' \r\n' < /tmp/total.txt)"
          echo "现有 release: ${TOTAL}，保留最近 ${KEEP} 个"
          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "无需清理"
            exit 0
          fi

          # 按创建时间倒序后跳过前 KEEP 个。刚创建的这一个必然排第一，不会被误删；
          # build.yml 的插件变更对比依赖 releases/latest 的 go_modules.json，必须保住。
          gh_retry /tmp/prune.txt release list --limit 500 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[${KEEP}:] | .[].tagName"
          while read -r tag; do
              [ -n "$tag" ] || continue
              echo "  删除 $tag"
              gh release delete "$tag" --yes --cleanup-tag || echo "  ! $tag 删除失败"
            done < /tmp/prune.txt

  # 分发层。所有下游平台（Gitee / CNB / R2）都在 mirror.yml 里，
  # 加平台只改那一个文件。任一平台的 token 没配，对应的 step 自己跳过；
  # 整个 job 失败也不影响 GitHub 侧已经发出去的 release。
  mirror:
    needs: [init, release]
    uses: ./.github/workflows/mirror.yml
    secrets: inherit
    with:
      tag: ${{ needs.init.outputs.version_tag }}
