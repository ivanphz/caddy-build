name: Mirror to CN platforms

# 把 GitHub Release 的二进制镜像到 Gitee / CNB，给受限网络提供下载路径。
#
# 刻意【不】同步的东西：
#   - 源码（镜像仓库只需 README.md + scripts/install.sh + 一个分支）
#   - go_modules.json / main.go —— 这两个会完整列出全部插件
#   - GitHub 那份 release notes —— 里面有插件版本表格
#
# Gitee 支持 SSH 中转（实测 runner 直传 <75 KB/s 且卡死，香港机器 3000 KB/s）：
# 只有 72MB 的上传腿走中转机，建 release / 清理旧版本等控制面仍在 runner 上跑。
# CNB 直连即可（runner 实测 366 KB/s），不需要中转。
#
# 但要清楚一件事：二进制本身会暴露插件。Go 把依赖清单写在 buildinfo 段里，
# `-ldflags "-w -s"` 剥不掉，`strings caddy | grep forwardproxy` 直接命中，
# 不需要运行它。所以不同步清单只降低仓库页面的关键词可发现性，
# 不降低产物被识别的概率 —— 这是两个不同的目标。
#
# 先用 workflow_dispatch 手动跑通，再在 build.yml 的 release job 后面加：
#   mirror-cn:
#     needs: [init, release]
#     uses: ./.github/workflows/mirror_cn.yml
#     secrets: inherit
#     with: { tag: '${{ needs.init.outputs.version_tag }}' }

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要镜像的 tag（留空 = 最新 release）'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mirror-cn
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PROGRESS_INTERVAL: '15'   # 上传进度打印间隔（秒）
  # 只镜像这四个。其余 release 资产（go_modules.json / main.go）留在 GitHub。
  ASSETS: 'caddy-linux-amd64 caddy-linux-amd64.sha256 caddy-linux-arm64 caddy-linux-arm64.sha256'

jobs:
  mirror:
    runs-on: ubuntu-latest
    # secrets 上下文在 step 的 if: 里不可用，只能先落到 job 级 env 再判 env.X。
    # job 级 env 允许引用 secrets，step 级 if 允许引用 env，从这里绕过去。
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag & download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WANT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$WANT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          [ -n "$TAG" ] || { echo "::error::找不到可镜像的 release"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "镜像目标: $TAG"

          # 保留策略的基准：GitHub 上现存的 tag，按新到旧。
          # 镜像端只做集合差，不依赖它自己的排序 —— CNB 的 id 是超 2^53 的雪花号，
          # jq 的 sort_by 按 double 比较会排错，进而删错 release。
          gh release list --limit 500 --json tagName --jq '.[].tagName' > /tmp/gh_tags.txt
          echo "GitHub 现存 release: $(wc -l < /tmp/gh_tags.txt) 个"

          mkdir -p dl && cd dl
          for a in $ASSETS; do
            gh release download "$TAG" --pattern "$a" --clobber
            echo "  ✓ $a  ($(du -h "$a" | cut -f1))"
          done

          # 镜像用的 release 说明：只给校验和，不含任何插件信息
          {
            echo "Caddy build \`${TAG}\`"
            echo ""
            echo '```'
            cat ./*.sha256
            echo '```'
          } > ../body.md

      # 同步 README + install.sh 到镜像仓库的公共逻辑。
      # 必须在建 release 之前跑 —— 两个平台建 release 都要 target_commitish，
      # 空仓库没有 main 分支会直接失败。
      - name: Write sync helper
        run: |
          set -euo pipefail
          cat > /tmp/sync_mirror.sh <<'HELPER'
          #!/usr/bin/env bash
          # $1=remote(含凭据) $2=平台名 $3=RAW_BASE $4=REL_BASE $5=TAG $6=分支
          set -euo pipefail
          BR="$6"
          rm -rf /tmp/work && mkdir -p /tmp/work/scripts && cd /tmp/work
          git init -q -b "$BR"
          git config user.email 'actions@users.noreply.github.com'
          git config user.name  'mirror-bot'
          git remote add origin "$1"
          # 已有内容就接着提交，保留历史；空仓库则从零开始
          if git fetch -q --depth 1 origin "$BR" 2>/dev/null; then
            git reset -q --hard "origin/${BR}"
          fi
          mkdir -p scripts
          cp "$GITHUB_WORKSPACE/scripts/install.sh" scripts/install.sh
          chmod 0755 scripts/install.sh
          sed -e "s|{{PLATFORM}}|$2|g" -e "s|{{RAW_BASE}}|$3|g" \
              -e "s|{{REL_BASE}}|$4|g" -e "s|{{TAG}}|$5|g" \
              "$GITHUB_WORKSPACE/mirror/README.md" > README.md
          git add -A
          if git diff --cached --quiet; then
            echo "  文件无变更，跳过推送"
          else
            git commit -qm "sync $5"
            git push -q origin "HEAD:${BR}"
            echo "  ✓ 已同步 README.md + scripts/install.sh"
          fi
          HELPER
          chmod +x /tmp/sync_mirror.sh

          # 上传进度监视。curl 的进度表用 \r 覆盖同一行，直接进日志会刷屏，
          # 所以转成换行后节流取最后一条。注意：curl 必须【不带 -s】——
          # -s 会把进度表整个关掉（这是之前完全看不到进度的原因），
          # 单用 -S 保留报错输出即可。
          cat > /tmp/progress.sh <<'PROG'
          progress_watch() {   # $1=curl的stderr文件 $2=间隔秒
            local last="" line
            while :; do
              sleep "$2"
              [ -s "$1" ] || continue
              line="$(tr '\r' '\n' < "$1" | awk 'NF>=12 && $1 ~ /^[0-9]+$/' | tail -n1)"
              { [ -z "$line" ] || [ "$line" = "$last" ]; } && continue
              last="$line"
              # 字段: 5=已传% 6=已传量 2=总量 12=当前速度 11=剩余时间
              printf '%s\n' "$line" \
                | awk '{printf "    %s%%  %s/%s   当前 %s/s   剩余 %s\n", $5, $6, $2, $12, $11}'
            done
          }

          # 启停必须封装。裸写 `kill $PID; wait $PID` 在 set -e 下会炸：
          # wait 一个被 SIGTERM 杀掉的任务返回 143，set -e 据此终止整个脚本
          # （表现为 step 退出码 143，且看不出任何原因）。
          PROG_ERRF=""; PROG_PID=""
          progress_start() {
            PROG_ERRF="$(mktemp)"
            progress_watch "$PROG_ERRF" "${PROGRESS_INTERVAL:-15}" &
            PROG_PID=$!
          }
          progress_stop() {
            [ -n "$PROG_PID" ] && kill "$PROG_PID" 2>/dev/null || true
            [ -n "$PROG_PID" ] && wait "$PROG_PID" 2>/dev/null || true
            PROG_PID=""
          }
          progress_tail() {   # 失败时回显 curl 最后几行 stderr
            [ -s "$PROG_ERRF" ] && tr '\r' '\n' < "$PROG_ERRF" \
              | grep -v '^[[:space:]]*$' | tail -2 || true
          }
          progress_cleanup() { [ -n "$PROG_ERRF" ] && rm -f "$PROG_ERRF" || true; }
          PROG

      # ==================================================================
      # Gitee
      # 配额硬约束：单附件 ≤100M，【每仓库总附件 ≤1G，含仓库附件和发行版附件】。
      # 每个 release 约 139MB → 最多 7 个就撑满，所以保留数默认 5，比 GitHub 那边紧。
      # 不真删旧版本的话，某次推送会静默失败在配额上。
      # ==================================================================
      - name: Push to Gitee
        # !cancelled() 而不是默认的 success()：两个镜像互相独立，
        # 一边失败不该让另一边连试都不试。job 整体仍会标红。
        if: ${{ !cancelled() && env.GITEE_TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
          OWNER_REPO: ${{ vars.GITEE_REPO }}      # 例: ivanabc/caddy-build
          # 留空 = 传全部。跨境上传 68MB 到 Gitee 实测走不通时，可以设成
          # 只传校验和（例: "caddy-linux-amd64.sha256 caddy-linux-arm64.sha256"），
          # 让 Gitee 只承担 install.sh + README 的分发。
          ONLY: ${{ vars.GITEE_ASSETS }}
          # ---- SSH 中转（留空 = 直连）----
          RELAY_HOST: ${{ vars.GITEE_RELAY_HOST }}
          RELAY_USER: ${{ vars.GITEE_RELAY_USER || 'root' }}
          RELAY_PORT: ${{ vars.GITEE_RELAY_PORT || '22' }}
          RELAY_KEY: ${{ secrets.GITEE_RELAY_KEY }}
          RELAY_KNOWN_HOSTS: ${{ vars.GITEE_RELAY_KNOWN_HOSTS }}
          GH_REPO_FULL: ${{ github.repository }}
          # 留空则自动探测远端默认分支 —— Gitee 建仓默认是 master，不是 main。
          # 写死分支名是上一版最主要的坑。
          # git 推送用户名默认从 OWNER_REPO 取斜杠前那段 —— 个人仓库的 owner
          # 就是登录名。只有仓库属于「组织」时 owner ≠ 登录名，才需要设
          # GITEE_USER 覆盖。刻意不叫 USER：那是 Unix 标准环境变量，
          # 覆盖它等于给自己埋雷（不声明时它会是 runner，推送会静默用错用户名）。
          GITEE_LOGIN: ${{ vars.GITEE_USER }}
          BRANCH: ${{ vars.GITEE_BRANCH }}
          KEEP: ${{ vars.GITEE_KEEP || 5 }}
        run: |
          set -euo pipefail
          [ -n "$OWNER_REPO" ] || { echo "::error::请设置仓库变量 GITEE_REPO"; exit 1; }
          LOGIN="${GITEE_LOGIN:-${OWNER_REPO%%/*}}"
          REMOTE="https://${LOGIN}:${TOKEN}@gitee.com/${OWNER_REPO}.git"
          API="https://gitee.com/api/v5/repos/${OWNER_REPO}"
          HDR="Authorization: token ${TOKEN}"

          # 探测远端默认分支。Gitee 建仓默认 master，写死 main 会推到一个
          # 谁也看不见的新分支上，而仓库首页仍显示 master 的旧内容。
          # || true 不能省：set -e 下命令替换失败会终止整个 step，
          # 而 2>/dev/null 已把原因吞掉 —— 表现为无任何输出的静默失败。
          DET="$(git ls-remote --symref "$REMOTE" HEAD 2>/dev/null \
                 | awk '/^ref:/{sub("refs/heads/","",$2); print $2; exit}' || true)"
          BR="${BRANCH:-${DET:-main}}"
          echo "推送用户名: $LOGIN    目标分支: $BR${DET:+（远端默认 $DET）}"

          RAW="https://gitee.com/${OWNER_REPO}/raw/${BR}"
          REL="https://gitee.com/${OWNER_REPO}/releases/download"

          echo "== 同步 README + install.sh =="
          /tmp/sync_mirror.sh "$REMOTE" Gitee "$RAW" "$REL" "$TAG" "$BR"

          # 幂等：同名 release 先删掉再建，否则重跑会撞 tag。
          # 附件挂在 release 上，删 release 等于连附件一起清干净。
          OLD="$(curl -sS "${API}/releases/tags/${TAG}" -H "$HDR" | jq -r '.id // empty')"
          if [ -n "$OLD" ]; then
            echo "== 已存在同名 release id=$OLD，先删除 =="
            curl -sS -o /dev/null -X DELETE "${API}/releases/${OLD}" -H "$HDR"
          fi

          echo "== 创建 release =="
          RESP="$(curl -sS -X POST "${API}/releases" -H "$HDR" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TAG" --arg b "$(cat body.md)" --arg c "$BR" \
                  '{tag_name:$t, name:$t, body:$b, target_commitish:$c, prerelease:false}')")"
          RID="$(echo "$RESP" | jq -r '.id // empty')"
          if [ -z "$RID" ]; then
            echo "::error::创建失败: $(echo "$RESP" | head -c 500)"; exit 1
          fi
          echo "  release_id=$RID"

          source /tmp/progress.sh
          # 按体积从小到大：.sha256 只有几十字节，先传它能在 2 秒内验证端点，
          # 而不是等一个 69MB 的上传挂十分钟才发现路径写错。
          UPLOADS="$(ls -S -r $(printf 'dl/%s ' ${ONLY:-$ASSETS}) | xargs -n1 basename | tr '\n' ' ')"

          if [ -n "$RELAY_HOST" ] && [ -n "$RELAY_KEY" ]; then
            # ============================================================
            # SSH 中转上传
            # runner 只发几 KB 的指令，72MB 由中转机直接从 GitHub 拉再传 Gitee。
            # 三条「不残留」保证：
            #   1) 远端全部工作放在 mktemp -d，trap 覆盖 EXIT/HUP/INT/TERM，
            #      连 SSH 断线（SIGHUP）也会清理
            #   2) 脚本经 stdin 喂给 bash -s，不落远端磁盘
            #   3) token 不进命令行（ps 可见），写成 curl 配置文件放在临时目录
            # ============================================================
            echo "== 上传附件（经 ${RELAY_USER}@${RELAY_HOST} 中转）=="

            KEYF="$(mktemp)"; printf '%s\n' "$RELAY_KEY" > "$KEYF"; chmod 600 "$KEYF"
            KH="$(mktemp)"
            SSHOPT=(-i "$KEYF" -p "$RELAY_PORT" -o BatchMode=yes -o ConnectTimeout=20
                    -o ServerAliveInterval=30 -o ServerAliveCountMax=6
                    -o UserKnownHostsFile="$KH")
            if [ -n "$RELAY_KNOWN_HOSTS" ]; then
              printf '%s\n' "$RELAY_KNOWN_HOSTS" > "$KH"
              SSHOPT+=(-o StrictHostKeyChecking=yes)
            else
              ssh-keyscan -p "$RELAY_PORT" -H "$RELAY_HOST" > "$KH" 2>/dev/null || true
              echo "::warning::未设置 GITEE_RELAY_KNOWN_HOSTS，已用 ssh-keyscan 接受主机指纹（存在中间人风险）。建议在中转机上跑 ssh-keyscan -p ${RELAY_PORT} <host> 并把输出填进该变量。"
            fi

            RELAY="$(mktemp)"
            {
              # 参数用 printf %q 传，token 含任何特殊字符都能安全还原；
              # 脚本体用带引号的 heredoc，不会在 runner 侧被展开。
              printf 'TOKEN=%q\n'    "$TOKEN"
              printf 'API=%q\n'      "$API"
              printf 'RID=%q\n'      "$RID"
              printf 'ASSETS=%q\n'   "$UPLOADS"
              printf 'GH_BASE=%q\n'  "https://github.com/${GH_REPO_FULL}/releases/download/${TAG}"
              printf 'SHA_LINES=%q\n' "$(cat dl/*.sha256)"
              printf 'INTERVAL=%q\n' "${PROGRESS_INTERVAL:-15}"
              cat <<'REMOTE'
          set -euo pipefail
          command -v curl >/dev/null || { echo "远端缺少 curl"; exit 1; }
          umask 077
          WORK="$(mktemp -d)"
          # 覆盖 HUP：SSH 连接断开时远端进程收到的就是 SIGHUP
          trap 'rm -rf "$WORK"' EXIT HUP INT TERM
          cd "$WORK"

          echo "    中转机 $(uname -n) $(uname -m)   工作目录 $WORK"
          AVAIL="$(df -Pm . | awk 'NR==2{print $4}')"
          [ "${AVAIL:-0}" -ge 300 ] || { echo "远端可用空间不足 300MB (${AVAIL}MB)"; exit 1; }

          # token 走 curl 配置文件，不进命令行 —— 否则整个上传期间
          # 任何用户 ps 一下就能看到它
          printf 'header = "Authorization: token %s"\n' "$TOKEN" > cfg
          printf '%s\n' "$SHA_LINES" > SHA256SUMS

          progress_watch() {
            local last="" line
            while :; do
              sleep "$INTERVAL"
              [ -s "$1" ] || continue
              line="$(tr '\r' '\n' < "$1" | awk 'NF>=12 && $1 ~ /^[0-9]+$/' | tail -n1)"
              { [ -z "$line" ] || [ "$line" = "$last" ]; } && continue
              last="$line"
              printf '%s\n' "$line" \
                | awk '{printf "      %s%%  %s/%s   当前 %s/s   剩余 %s\n", $5, $6, $2, $12, $11}'
            done
          }
          PE=""; PP=""
          pstart() { PE="$(mktemp -p "$WORK")"; progress_watch "$PE" & PP=$!; }
          pstop()  { [ -n "$PP" ] && kill "$PP" 2>/dev/null || true
                     [ -n "$PP" ] && wait "$PP" 2>/dev/null || true; PP=""; }
          ptail()  { [ -s "$PE" ] && tr '\r' '\n' < "$PE" | grep -v '^[[:space:]]*$' | tail -2 || true; }

          for a in $ASSETS; do
            echo "    ↓ GitHub → 中转机: $a"
            pstart
            curl -S -fL --retry 3 --retry-delay 3 --max-time 1800 \
                 -o "$a" "${GH_BASE}/${a}" 2>"$PE" || { pstop; echo "下载失败 $a: $(ptail)"; exit 1; }
            pstop
          done

          # 校验和来自 runner 上已下载的那份，等于做了一次端到端一致性检查
          sha256sum -c --ignore-missing SHA256SUMS \
            || { echo "SHA256 校验失败，中止（不上传可疑文件）"; exit 1; }
          echo "    ✓ SHA256 校验通过"

          for a in $ASSETS; do
            echo "    ↑ 中转机 → Gitee: $a ($(du -h "$a" | cut -f1))"
            pstart
            STAT="$(curl -S -K cfg --max-time 1800 --retry 2 --retry-delay 5 \
                    -o resp.json -w '%{http_code}|%{time_total}|%{speed_upload}' \
                    -X POST "${API}/releases/${RID}/attach_files" \
                    -F "file=@${a}" 2>"$PE")" || { pstop; echo "上传中断 $a: $(ptail)"; exit 1; }
            pstop
            IFS='|' read -r HTTP SECS SPD <<< "$STAT"
            printf '      HTTP %s | 用时 %ss | 上行 %s KB/s\n' "$HTTP" "$SECS" \
                   "$(awk -v s="$SPD" 'BEGIN{printf "%.0f", s/1024}')"
            # 不依赖远端有 jq
            grep -q '"id"' resp.json \
              || { echo "上传失败 $a (HTTP $HTTP): $(head -c 300 resp.json)"; exit 1; }
            echo "      ✓ $a"
          done
          echo "    中转完成，临时目录将随本次会话一并清理"
          REMOTE
            } > "$RELAY"

            ssh "${SSHOPT[@]}" "${RELAY_USER}@${RELAY_HOST}" 'bash -s' < "$RELAY" \
              || { rm -f "$KEYF" "$KH" "$RELAY"; echo "::error::中转上传失败"; exit 1; }
            rm -f "$KEYF" "$KH" "$RELAY"
          else
            # ============================================================
            # 直连上传（未配置中转时）
            # ============================================================
            echo "== 上传附件（runner 直连）=="
            for a in $UPLOADS; do
              echo "  上传 ${a} ($(du -h "dl/${a}" | cut -f1)) …"
              # 响应体写文件、变量只接 -w 的统计 —— 混在一起会让 jq 解析完 JSON
              # 之后撞上统计文本而报错，把一次成功的上传误判成失败。
              progress_start
              STAT="$(curl -S --max-time 1800 --retry 2 --retry-delay 5 \
                      -o /tmp/resp.json \
                      -w '%{http_code}|%{time_total}|%{speed_upload}' \
                      -X POST "${API}/releases/${RID}/attach_files" -H "$HDR" \
                      -F "file=@dl/${a}" 2>"$PROG_ERRF")" || {
                        progress_stop
                        echo "::error::上传 ${a} 超时或中断: $(progress_tail)"
                        progress_cleanup; exit 1; }
              progress_stop; progress_cleanup
              IFS='|' read -r HTTP SECS SPD <<< "$STAT"
              printf '  HTTP %s | 用时 %ss | 上行 %s KB/s\n' "$HTTP" "$SECS" \
                     "$(awk -v s="$SPD" 'BEGIN{printf "%.0f", s/1024}')"
              jq -e '.id' /tmp/resp.json >/dev/null 2>&1 \
                || { echo "::error::上传 ${a} 失败 (HTTP $HTTP): $(head -c 400 /tmp/resp.json)"; exit 1; }
              echo "  ✓ ${a}"
            done
          fi

          echo "== 清理旧版本（保留 GitHub 最新 $KEEP 个 tag）=="
          head -n "$KEEP" /tmp/gh_tags.txt > /tmp/keep.txt
          if [ ! -s /tmp/keep.txt ]; then
            echo "  ::warning::保留清单为空，跳过清理（避免误删全部）"
          else
            curl -sS "${API}/releases?page=1&per_page=100" -H "$HDR" \
              | jq -r '.[] | "\(.id)\t\(.tag_name)"' \
              | while IFS=$'\t' read -r id tag; do
                  [ -n "$id" ] || continue
                  if ! grep -qxF "$tag" /tmp/keep.txt; then
                    echo "  删除 $tag (id=$id)"
                    curl -sS -o /dev/null -X DELETE "${API}/releases/${id}" -H "$HDR"
                  fi
                done
          fi

          echo "下载地址: ${REL}/${TAG}/caddy-linux-amd64"

      # ==================================================================
      # CNB —— 三步预签名上传，不是 multipart POST：
      #   1) POST .../asset-upload-url   拿 upload_url + verify_url
      #   2) PUT  <upload_url>           流式发文件
      #   3) POST .../asset-upload-confirmation/{upload_token}/{asset_path}?ttl=0
      # ttl 必须显式传 0（0=永久，最大 180 天）。不传的话附件可能到期消失，
      # 表现为几个月后某台机器更新时 404 —— 这类故障最难排查。
      # ==================================================================
      - name: Push to CNB
        if: ${{ !cancelled() && env.CNB_TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.CNB_TOKEN }}         # 需要 repo-release:rw 权限
          OWNER_REPO: ${{ vars.CNB_REPO }}        # 例: ivanabc/caddy-build
          ONLY: ${{ vars.CNB_ASSETS }}            # 留空 = 传全部
          BRANCH: ${{ vars.CNB_BRANCH }}   # 留空则自动探测远端默认分支
          KEEP: ${{ vars.CNB_KEEP || 12 }}
        run: |
          set -euo pipefail
          [ -n "$OWNER_REPO" ] || { echo "::error::请设置仓库变量 CNB_REPO"; exit 1; }
          API="https://api.cnb.cool/${OWNER_REPO}/-/releases"
          AUTH="Authorization: Bearer ${TOKEN}"
          # 必须显式声明 Accept —— curl 默认发 */*，CNB 直接回 406。
          # 它的错误文案提的是 content type，但 406 的语义是内容协商，坑在这。
          # CNB 官方 CLI 发的是 application/vnd.cnb.api+json，application/json 同样接受。
          ACC='Accept: application/json'
          # CNB 的 git 认证：用户名固定 cnb，密码填访问令牌，不支持 SSH
          REMOTE="https://cnb:${TOKEN}@cnb.cool/${OWNER_REPO}.git"

          # || true 不能省：set -e 下命令替换失败会终止整个 step，
          # 而 2>/dev/null 已把原因吞掉 —— 表现为无任何输出的静默失败。
          DET="$(git ls-remote --symref "$REMOTE" HEAD 2>/dev/null \
                 | awk '/^ref:/{sub("refs/heads/","",$2); print $2; exit}' || true)"
          BR="${BRANCH:-${DET:-main}}"
          echo "目标分支: $BR${DET:+（远端默认 $DET）}"

          RAW="https://cnb.cool/${OWNER_REPO}/-/raw/${BR}"
          REL="https://cnb.cool/${OWNER_REPO}/-/releases/download"

          echo "== 同步 README + install.sh =="
          /tmp/sync_mirror.sh "$REMOTE" CNB "$RAW" "$REL" "$TAG" "$BR"

          # 幂等：同名 release 先删再建
          OLD="$(curl -sS "${API}/tags/${TAG}" -H "$AUTH" -H "$ACC" | jq -r '.id // empty')"
          if [ -n "$OLD" ]; then
            echo "== 已存在同名 release id=$OLD，先删除 =="
            curl -sS -o /dev/null -X DELETE "${API}/${OLD}" -H "$AUTH" -H "$ACC"
          fi

          echo "== 创建 release =="
          RESP="$(curl -sS -X POST "$API" -H "$AUTH" -H "$ACC" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TAG" --arg b "$(cat body.md)" --arg c "$BR" \
                  '{tag_name:$t, name:$t, body:$b, target_commitish:$c, make_latest:"true"}')")"
          RID="$(echo "$RESP" | jq -r '.id // empty')"
          if [ -z "$RID" ]; then
            echo "::error::创建失败: $(echo "$RESP" | head -c 500)"; exit 1
          fi
          echo "  release_id=$RID"

          source /tmp/progress.sh
          echo "== 上传附件 =="
          # 同样按体积从小到大：先用 100 字节的 .sha256 验证三步流程走得通
          for a in $(ls -S -r $(printf 'dl/%s ' ${ONLY:-$ASSETS}) | xargs -n1 basename); do
            SIZE="$(stat -c%s "dl/${a}")"

            U="$(curl -sS -X POST "${API}/${RID}/asset-upload-url" -H "$AUTH" -H "$ACC" \
                 -H 'Content-Type: application/json' \
                 -d "$(jq -n --arg n "$a" --argjson s "$SIZE" \
                       '{asset_name:$n, size:$s, overwrite:true, ttl:0}')")"
            UP="$(echo "$U" | jq -r '.upload_url // empty')"
            VF="$(echo "$U" | jq -r '.verify_url // empty')"
            [ -n "$UP" ] && [ -n "$VF" ] \
              || { echo "::error::取上传地址失败 $a: $(echo "$U" | head -c 400)"; exit 1; }

            echo "  上传 ${a} ($(du -h "dl/${a}" | cut -f1)) …"
            # -o /dev/null：预签名存储的响应体没用，别刷屏。
            # curl 不带 -f 时 4xx 也返回 0，所以必须自己查状态码。
            progress_start
            STAT="$(curl -S --max-time 1800 --retry 2 --retry-delay 5 \
                    -o /dev/null -w '%{http_code}|%{time_total}|%{speed_upload}' \
                    -X PUT "$UP" --upload-file "dl/${a}" 2>"$PROG_ERRF")" \
              || { progress_stop
                   echo "::error::PUT 失败 ${a}: $(progress_tail)"
                   progress_cleanup; exit 1; }
            progress_stop; progress_cleanup
            IFS='|' read -r HTTP SECS SPD <<< "$STAT"
            printf '  HTTP %s | 用时 %ss | 上行 %s KB/s\n' "$HTTP" "$SECS" \
                   "$(awk -v s="$SPD" 'BEGIN{printf "%.0f", s/1024}')"
            case "$HTTP" in
              2*) ;;
              *) echo "::error::PUT ${a} 返回 HTTP $HTTP"; exit 1 ;;
            esac

            # verify_url 形如 .../asset-upload-confirmation/{upload_token}/{asset_path}
            TAIL="${VF#*/asset-upload-confirmation/}"
            UPTOKEN="${TAIL%%/*}"
            APATH="${TAIL#*/}"
            curl -sS -o /dev/null -X POST \
              "${API}/${RID}/asset-upload-confirmation/${UPTOKEN}/${APATH}?ttl=0" -H "$AUTH" -H "$ACC" \
              || { echo "::error::确认失败 $a"; exit 1; }
            echo "  ✓ $a"
          done

          echo "== 清理旧版本（保留 GitHub 最新 $KEEP 个 tag）=="
          head -n "$KEEP" /tmp/gh_tags.txt > /tmp/keep.txt
          if [ ! -s /tmp/keep.txt ]; then
            echo "  ::warning::保留清单为空，跳过清理（避免误删全部）"
          else
            # 列表接口返回的是裸数组（schema: type=array），没有 items 包装。
            # .id 只做透传，jq 1.7 会保留字面量，不会丢雪花号精度。
            curl -sS "${API}?page=1&page_size=100" -H "$AUTH" -H "$ACC" \
              | jq -r '.[] | "\(.id)\t\(.tag_name)"' \
              | while IFS=$'\t' read -r id tag; do
                  [ -n "$id" ] || continue
                  if ! grep -qxF "$tag" /tmp/keep.txt; then
                    echo "  删除 $tag (id=$id)"
                    curl -sS -o /dev/null -X DELETE "${API}/${id}" -H "$AUTH" -H "$ACC"
                  fi
                done
          fi

          echo "下载地址: ${REL}/${TAG}/caddy-linux-amd64"

      - name: Summary
        run: |
          {
            echo "### CN 镜像 \`${TAG}\`"
            echo ""
            echo "Gitee 安装："
            echo '```bash'
            echo "curl -fsSL https://gitee.com/${{ vars.GITEE_REPO }}/raw/main/scripts/install.sh | sudo \\"
            echo "  CADDY_RAW_BASE=https://gitee.com/${{ vars.GITEE_REPO }}/raw/main \\"
            echo "  CADDY_REL_BASE=https://gitee.com/${{ vars.GITEE_REPO }}/releases/download bash"
            echo '```'
            echo "CNB 安装："
            echo '```bash'
            echo "curl -fsSL https://cnb.cool/${{ vars.CNB_REPO }}/-/raw/main/scripts/install.sh | sudo \\"
            echo "  CADDY_RAW_BASE=https://cnb.cool/${{ vars.CNB_REPO }}/-/raw/main \\"
            echo "  CADDY_REL_BASE=https://cnb.cool/${{ vars.CNB_REPO }}/-/releases/download bash"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
