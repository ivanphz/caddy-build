name: Update Dependencies

on:
  schedule:
    - cron: '0 10 * * 5'   # 每周五 18:00 (Asia/Shanghai)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'plugins.txt'

permissions:
  contents: write

concurrency:
  group: update-deps
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  GOFLAGS: -mod=mod

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须用 PAT：GITHUB_TOKEN 推送不会触发 build.yml
          token: ${{ secrets.PAT }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Resolve plugins.txt -> go.mod
        run: |
          set -euo pipefail

          # ---- 0. 初始化 go.mod ----
          if [ ! -f go.mod ]; then
            go mod init "github.com/${{ github.repository }}"
          fi

          # ---- 1. 离线清掉所有旧 replace ----
          # 用 go mod edit -json 而不是 go list -m all：纯本地解析，不走网络，不会被网络故障静默跳过
          for pkg in $(go mod edit -json | jq -r '.Replace[]?.Old.Path'); do
            echo "dropreplace: $pkg"
            go mod edit -dropreplace="$pkg"
          done

          # ---- 2. 逐条处理 plugins.txt ----
          # 必须带 =() 初始化：`declare -a x` 只登记属性、不真正给变量赋值，
          # 在 set -u 下 ${#x[@]} 会报 unbound variable。bash 4.4+ 对 ${x[@]}
          # 放宽了检查但对 ${#x[@]} 没有，所以恰恰是「零失败」这条正常路径会炸。
          declare -A seen=()
          declare -a imports=()
          declare -a failed=()

          # tr -d '\r'：防 CRLF 混入导致 import 里带 ^M
          while read -r line; do
            line="$(printf '%s' "$line" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$line" ] && continue

            echo "::group::$line"

            if [[ "$line" == *"="* ]]; then
              # --- 形如 original=replacement@ref ---
              ORIGINAL="${line%%=*}"
              REPLACEMENT="${line#*=}"

              if [[ "$REPLACEMENT" == *"@"* ]]; then
                REPL_PATH="${REPLACEMENT%@*}"
                REPL_REF="${REPLACEMENT##*@}"
              else
                REPL_PATH="$REPLACEMENT"
                REPL_REF="latest"
              fi

              # go mod edit -replace 不做任何解析，直接把 "naive" 这种分支名原样写进 go.mod。
              # 所以先用 go list -m 把 分支/tag 解析成 pseudo-version，再写 replace。
              if ! RESOLVED="$(go list -m -f '{{.Version}}' "${REPL_PATH}@${REPL_REF}" 2>&1)"; then
                echo "✗ 无法解析 ${REPL_PATH}@${REPL_REF}: $RESOLVED"
                failed+=("$line"); echo "::endgroup::"; continue
              fi
              echo "  ${REPL_REF} -> ${RESOLVED}"

              if ! go mod edit -replace "${ORIGINAL}=${REPL_PATH}@${RESOLVED}"; then
                echo "✗ replace 写入失败"
                failed+=("$line"); echo "::endgroup::"; continue
              fi

              # 注意：这里刻意【不】执行 go get "$ORIGINAL"。
              # ORIGINAL 已被 replace，不参与编译；去追它的上游只会让 go.mod 每周无谓变更，
              # 进而触发一次内容完全相同的 Release。require 行交给下面的 go mod tidy 补。
              TARGET="$ORIGINAL"
            else
              # --- 普通插件 ---
              if ! go get "${line}@latest"; then
                echo "✗ go get 失败"
                failed+=("$line"); echo "::endgroup::"; continue
              fi
              TARGET="$line"
            fi

            if [ -z "${seen[$TARGET]:-}" ]; then
              imports+=("$TARGET")
              seen[$TARGET]=1
            fi
            echo "::endgroup::"
          done < <(grep -vE '^[[:space:]]*#|^[[:space:]]*$' plugins.txt)

          # ---- 3. 生成 main.go（唯一真源，不再有 tools.go）----
          {
            echo "// Code generated by .github/workflows/update_deps.yml from plugins.txt. DO NOT EDIT."
            echo
            echo "package main"
            echo
            echo "import ("
            echo '	_ "time/tzdata" // 内嵌时区数据库，精简系统上 @ 时间匹配器才可用'
            echo
            echo '	caddycmd "github.com/caddyserver/caddy/v2/cmd"'
            echo
            echo '	_ "github.com/caddyserver/caddy/v2/modules/standard"'
            for p in "${imports[@]}"; do
              [ "$p" = "github.com/caddyserver/caddy/v2" ] && continue
              printf '\t_ "%s"\n' "$p"
            done
            echo ")"
            echo
            echo "func main() {"
            echo "	caddycmd.Main()"
            echo "}"
          } > main.go

          gofmt -w main.go
          echo "--- main.go ---"; cat main.go

          # ---- 4. tidy（此时 import 集就是真实编译用的 import 集）----
          go mod tidy

          # ---- 5. 编译自检：宁可在这里失败，也不要提交一个编译不过的 go.mod ----
          go build -o /tmp/caddy-check .
          /tmp/caddy-check version

          # ---- 6. 汇报失败项 ----
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::以下条目处理失败："
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi
          echo "✓ 依赖更新完成"

      - name: Check for Changes
        id: git-check
        run: |
          if git diff --quiet go.mod go.sum main.go; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat go.mod go.sum main.go
          fi

      - name: Commit & Push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum main.go
          git commit -m "chore(deps): sync from plugins.txt"
          # cron 与手动 push 撞车时不至于直接失败
          git pull --rebase --autostash
          git push
